<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b16cff"/>
      <stop offset="0.5" stop-color="#7f8cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb1"><stop offset="0" stop-color="#7f00ff" stop-opacity=".55"/><stop offset="1" stop-color="#7f00ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#00d4ff" stop-opacity=".45"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="r"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .orb{animation:float 10s ease-in-out infinite}
    .o2{animation-duration:13s;animation-direction:reverse}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-25px)}}
    .dot{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .title{font:800 78px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;letter-spacing:2px}
    .sub{font:500 22px 'JetBrains Mono','Fira Code',Consolas,monospace;fill:#8b9bb4}
    .sub tspan.a{fill:#00d4ff}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .in{animation:up 1.2s cubic-bezier(.2,.8,.2,1) both}
    .d2{animation-delay:.4s}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(360px)}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="orb" cx="220" cy="90" r="260" fill="url(#orb1)"/>
    <circle class="orb o2" cx="1000" cy="250" r="280" fill="url(#orb2)"/>
    <g fill="#ffffff">
      <circle class="dot" cx="90" cy="60" r="1.6"/>
      <circle class="dot" cx="330" cy="260" r="1.4" style="animation-delay:.7s"/>
      <circle class="dot" cx="520" cy="40" r="1.8" style="animation-delay:1.4s"/>
      <circle class="dot" cx="760" cy="280" r="1.5" style="animation-delay:.3s"/>
      <circle class="dot" cx="890" cy="55" r="1.7" style="animation-delay:2s"/>
      <circle class="dot" cx="1110" cy="120" r="1.4" style="animation-delay:1.1s"/>
      <circle class="dot" cx="1050" cy="35" r="1.2" style="animation-delay:2.5s"/>
      <circle class="dot" cx="160" cy="250" r="1.3" style="animation-delay:1.8s"/>
    </g>
    <rect class="scan" x="0" y="0" width="1200" height="40" fill="#00d4ff" opacity=".04"/>
    <g class="in">
      <text x="600" y="165" text-anchor="middle" class="title" fill="url(#name)" filter="url(#glow)">Kiril Donets</text>
    </g>
    <g class="in d2">
      <text x="600" y="220" text-anchor="middle" class="sub"><tspan class="a">~$</tspan> developer · hosting founder · embedded explorer<tspan class="cur a"> ▍</tspan></text>
    </g>
    <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#7f8cff" stroke-opacity=".35" stroke-width="2"/>
  </g>
</svg>
