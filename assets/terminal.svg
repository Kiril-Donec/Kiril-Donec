<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <clipPath id="r"><rect width="900" height="420" rx="16"/></clipPath>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f00ff"/><stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <style>
    text{white-space:pre;font:16px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .p{fill:#00d4ff}.u{fill:#b16cff}.c{fill:#e6edf3}.k{fill:#7f8cff}.v{fill:#c9d1d9}.g{fill:#3fb950}.m{fill:#6e7681}
    .l{opacity:0;animation:show .01s forwards}
    @keyframes show{to{opacity:1}}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
  </style>
  <g clip-path="url(#r)">
    <rect width="900" height="420" fill="#0d1117"/>
    <rect width="900" height="40" fill="#161b22"/>
    <circle cx="24" cy="20" r="7" fill="#ff5f57"/><circle cx="46" cy="20" r="7" fill="#febc2e"/><circle cx="68" cy="20" r="7" fill="#28c840"/>
    <text x="450" y="26" text-anchor="middle" class="m" style="font-size:14px">kiril@momenthost: ~</text>

    <text x="24" y="80" class="l" style="animation-delay:.3s"><tspan class="u">kiril</tspan><tspan class="m">@</tspan><tspan class="p">momenthost</tspan><tspan class="m">:~$ </tspan><tspan class="c">neofetch --me</tspan></text>

    <text x="24" y="120" class="l" style="animation-delay:1s"><tspan class="k">name     </tspan><tspan class="v">Kiril Donets</tspan></text>
    <text x="24" y="148" class="l" style="animation-delay:1.3s"><tspan class="k">role     </tspan><tspan class="v">Independent developer · hosting founder</tspan></text>
    <text x="24" y="176" class="l" style="animation-delay:1.6s"><tspan class="k">infra    </tspan><tspan class="v">Linux · Docker · VPS · Pterodactyl · Cloudflare</tspan></text>
    <text x="24" y="204" class="l" style="animation-delay:1.9s"><tspan class="k">web      </tspan><tspan class="v">React · TypeScript · Laravel · Tailwind</tspan></text>
    <text x="24" y="232" class="l" style="animation-delay:2.2s"><tspan class="k">mobile   </tspan><tspan class="v">Kotlin · Jetpack Compose · Swift</tspan></text>
    <text x="24" y="260" class="l" style="animation-delay:2.5s"><tspan class="k">embedded </tspan><tspan class="v">ESP32 · Orange Pi · ARM64 · C / C++</tspan></text>
    <text x="24" y="288" class="l" style="animation-delay:2.8s"><tspan class="k">contact  </tspan><tspan class="p">t.me/KirixDev</tspan></text>

    <g class="l" style="animation-delay:3.2s">
      <rect x="24" y="310" width="28" height="16" fill="#7f00ff"/><rect x="56" y="310" width="28" height="16" fill="#5b3df0"/>
      <rect x="88" y="310" width="28" height="16" fill="#7f8cff"/><rect x="120" y="310" width="28" height="16" fill="#00d4ff"/>
      <rect x="152" y="310" width="28" height="16" fill="#3fb950"/><rect x="184" y="310" width="28" height="16" fill="#febc2e"/>
      <rect x="216" y="310" width="28" height="16" fill="#ff5f57"/><rect x="248" y="310" width="28" height="16" fill="#e6edf3"/>
    </g>

    <text x="24" y="372" class="l" style="animation-delay:3.6s"><tspan class="u">kiril</tspan><tspan class="m">@</tspan><tspan class="p">momenthost</tspan><tspan class="m">:~$ </tspan><tspan class="g">building something cool</tspan><tspan class="c cur"> █</tspan></text>
  </g>
  <rect x="1" y="1" width="898" height="418" rx="15" fill="none" stroke="url(#edge)" stroke-opacity=".6" stroke-width="2"/>
</svg>
